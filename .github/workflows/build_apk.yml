
          
name: Build Flutter APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v3
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Create Clean Flutter App
        run: |
          flutter create . --org com.example.app --project-name aivideoapp
          # Ensure lib directory exists and copy main.dart if available
          mkdir -p lib
          if [ -f "main.dart" ]; then cp main.dart lib/main.dart; fi

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          
